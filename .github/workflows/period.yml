name: Periodic Hello

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: Jtalk/url-health-check-action@v3
        with:
          url: https://fs-pokedex-ssoz.onrender.com/health
          follow-redirect: false
          max-attempts: 3
          retry-delay: 5s
          retry-all: false
